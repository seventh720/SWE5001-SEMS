name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
        working-directory: apps/web
      - name: Run lint and collect reports
        run: bash scripts/ci/lint.sh
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-report
          path: lint-reports/
          retention-days: 7
  backend:
    name: Backend · Unit Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      line: ${{ steps.coverage.outputs.line }}
      branch: ${{ steps.coverage.outputs.branch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Backend coverage summary
        id: coverage
        if: always()
        run: python3 scripts/ci/coverage.py backend
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: |
            services/*/target/site/jacoco/
            services/*/target/surefire-reports/
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-jars
          path: services/*/target/*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
  frontend:
    name: Frontend · Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      line: ${{ steps.coverage.outputs.line }}
      branch: ${{ steps.coverage.outputs.branch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:coverage
        working-directory: apps/web
      - name: Frontend coverage summary
        id: coverage
        if: always()
        run: python3 scripts/ci/coverage.py frontend
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage/
          retention-days: 7
      - run: npm run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7
  integration:
    name: Backend · Integration Tests
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: backend-jars
          path: services/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: apps/web/dist/
      - run: bash scripts/setup-local.sh
      - name: Validate deployment bundle
        run: |
          bash -n scripts/cd/*.sh scripts/security/*.sh scripts/performance/*.sh
          python3 scripts/cd/test-release.py
          python3 -m venv "$RUNNER_TEMP/k3s-python"
          "$RUNNER_TEMP/k3s-python/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/k3s-python/bin/python" scripts/cd/test-k3s-release.py
          python3 scripts/performance/test-tools.py
          python3 scripts/performance/test-local-experiment.py
          python3 scripts/performance/test-cloud-capacity.py
          bash scripts/cd/package.sh "$RUNNER_TEMP/release.tar.gz"
      - run: docker compose --env-file .env -f deployment/compose.yaml config --quiet
      - run: docker compose --env-file .env -f deployment/compose.yaml up --build -d --scale admission=2
      - run: bash scripts/smoke.sh
      - name: Database and business acceptance
        run: |
          bash scripts/check-db-isolation.sh
          set -a
          source .env
          set +a
          python3 scripts/business-fixes-acceptance.py
          python3 scripts/gateway-scaling-acceptance.py
          python3 scripts/organization-acceptance.py
          python3 scripts/catalog-read-acceptance.py
          python3 scripts/organization-security-acceptance.py
          python3 scripts/event-directory-acceptance.py
          python3 scripts/organization-management-acceptance.py --report ci-logs/organization-management.json
          python3 scripts/visibility-acceptance.py
          python3 scripts/notifications-acceptance.py
          python3 scripts/membership-notifications-acceptance.py
          python3 scripts/organization-governance-acceptance.py
          python3 scripts/event-cancellation-acceptance.py
          python3 scripts/predeployment-fixes-acceptance.py
          python3 scripts/organization-migration-acceptance.py
          python3 scripts/catalog-recovery-acceptance.py
          bash scripts/performance/smoke.sh
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p ci-logs
          if [ -f .env ]; then
            docker compose --env-file .env -f deployment/compose.yaml ps -a > ci-logs/containers.txt
            docker compose --env-file .env -f deployment/compose.yaml logs --no-color > ci-logs/compose.log 2>&1
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: integration-diagnostics
          path: ci-logs/
          retention-days: 7
      - name: Stop containers
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deployment/compose.yaml down
          fi

  security:
    name: Security · SAST, Dependencies & Secrets
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: backend-jars
          path: services/
      - run: bash scripts/security/scan.sh source
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: source-security-reports
          path: ci-logs/security/
          retention-days: 7

  images:
    name: Images · Scan, Smoke Test & Publish
    needs: [lint, backend, frontend, integration, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: backend-jars
          path: services/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: apps/web/dist/
      - name: Authenticate registry for main publication
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and scan images
        run: bash scripts/cd/images.sh
      - name: Verify exact runtime images
        run: bash scripts/cd/image-smoke.sh
      - name: Publish verified images on main
        if: github.ref == 'refs/heads/main'
        run: bash scripts/cd/publish-images.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: image-security-reports
          path: ci-logs/
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: release-image-lock
          path: deployment/compose.images.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    outputs:
      selected: ${{ steps.latest.outputs.deploy }}
    name: Deploy · EC2 K3s Test
    needs: [lint, backend, frontend, integration, security, images]
    permissions:
      contents: read
      packages: read
      id-token: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: k3s-test
      cancel-in-progress: false
    environment:
      name: k3s-test
      url: https://sems-test.seventh720.com
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Skip superseded main builds
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "This commit was superseded on main; skipping deployment."
          fi
      - uses: actions/download-artifact@v8.0.2
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: release-image-lock
          path: deployment/
      - name: Authenticate to AWS with GitHub OIDC
        if: steps.latest.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.K3S_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: sems-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
      - name: Deploy verified application digests to K3s
        if: steps.latest.outputs.deploy == 'true'
        env:
          K3S_INSTANCE_ID: ${{ vars.K3S_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "$K3S_INSTANCE_ID"
          python3 -m venv "$RUNNER_TEMP/k3s-python"
          "$RUNNER_TEMP/k3s-python/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$RUNNER_TEMP/k3s-python/bin/python" scripts/cd/k3s_release.py \
            --image-lock deployment/compose.images.json --commit "$GITHUB_SHA" \
            --release-id "$release_id" --output "$RUNNER_TEMP/k3s-release.json"
          python3 scripts/cd/submit-k3s.py --instance-id "$K3S_INSTANCE_ID" \
            --release "$RUNNER_TEMP/k3s-release.json" --report ci-logs/k3s-deploy/invocation.json
          echo "Deployed commit $GITHUB_SHA to https://sems-test.seventh720.com" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload K3s deployment result
        if: always() && steps.latest.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k3s-deployment
          path: ci-logs/k3s-deploy/
          retention-days: 30

  notify:
    name: Notify · Telegram
    needs: [lint, backend, frontend, integration, security, images, deploy]
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Send build result
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_SELECTED: ${{ needs.deploy.outputs.selected }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LINT_RESULT: ${{ needs.lint.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          BACKEND_LINES: ${{ needs.backend.outputs.line }}
          BACKEND_BRANCHES: ${{ needs.backend.outputs.branch }}
          FRONTEND_LINES: ${{ needs.frontend.outputs.line }}
          FRONTEND_BRANCHES: ${{ needs.frontend.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json, os, urllib.request
          token = os.environ.get('TELEGRAM_TOKEN')
          chat = os.environ.get('TELEGRAM_TO')
          if not token or not chat:
              print('::notice::Telegram secrets are absent; notification skipped.')
              raise SystemExit(0)
          icons = {'success': '✅', 'failure': '❌', 'cancelled': '🚫', 'skipped': '⏭️'}
          checks = [('Lint', 'LINT_RESULT'), ('Backend · Unit Tests & Build', 'BACKEND_RESULT'),
                    ('Frontend · Tests & Build', 'FRONTEND_RESULT'), ('Backend · Integration Tests', 'INTEGRATION_RESULT'),
                    ('Security · SAST, Dependencies & Secrets', 'SECURITY_RESULT'),
                    ('Images · Scan' + (' & Publish' if os.environ['GITHUB_EVENT_NAME'] != 'pull_request' else ''), 'IMAGES_RESULT')]
          results = [os.environ[key] for _, key in checks]
          deploy = os.environ['DEPLOY_RESULT']
          overall = '❌ Failed' if 'failure' in results + [deploy] else (
              '✅ Passed' if all(value == 'success' for value in results) else '⚠️ Incomplete')
          context = ('PR #' + os.environ['PR_NUMBER']) if os.environ['PR_NUMBER'] else os.environ['GITHUB_EVENT_NAME']
          lines = ['SEMS CI · ' + overall, os.environ['GITHUB_REPOSITORY'],
                   context + ' · ' + os.environ['SOURCE_BRANCH'],
                   'Commit: ' + os.environ['SOURCE_SHA'][:12] + ' · Actor: ' + os.environ['GITHUB_ACTOR'],
                   'Run #' + os.environ['GITHUB_RUN_NUMBER'] + ' · Attempt ' + os.environ['GITHUB_RUN_ATTEMPT'], '']
          lines += [icons.get(os.environ[key], '❔') + ' ' + label + ': ' + os.environ[key] for label, key in checks]
          if deploy == 'success' and os.environ['DEPLOY_SELECTED'] != 'true':
              lines.append('⏭️ Deploy: superseded commit; not deployed')
          elif deploy == 'skipped':
              lines.append('⏭️ Deploy: skipped (PR or unmet conditions)')
          else:
              lines.append(icons.get(deploy, '❔') + ' Deploy · EC2 K3s Test: ' + deploy)
          lines += ['', 'Coverage (line / branch; unit/component only)',
                    'Backend: ' + (os.environ['BACKEND_LINES'] or 'N/A') + ' / ' + (os.environ['BACKEND_BRANCHES'] or 'N/A'),
                    'Frontend: ' + (os.environ['FRONTEND_LINES'] or 'N/A') + ' / ' + (os.environ['FRONTEND_BRANCHES'] or 'N/A'),
                    '', 'Checks, logs & reports: ' + os.environ['RUN_URL']]
          text = '\n'.join(lines)
          request = urllib.request.Request(
              'https://api.telegram.org/bot' + token + '/sendMessage',
              data=json.dumps({'chat_id': chat, 'text': text}).encode(),
              headers={'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get('ok'):
                  raise RuntimeError('Rejected')
          except Exception:
              print('::warning::Telegram delivery failed; check bot access and repository secrets.')
              raise SystemExit(1)
          print('Telegram notification delivered.')
