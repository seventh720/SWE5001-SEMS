name: Platform CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      line: ${{ steps.coverage.outputs.line }}
      branch: ${{ steps.coverage.outputs.branch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Backend coverage summary
        id: coverage
        if: always()
        run: python3 scripts/ci/coverage.py backend
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: |
            services/*/target/site/jacoco/
            services/*/target/surefire-reports/
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-jars
          path: services/*/target/*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      line: ${{ steps.coverage.outputs.line }}
      branch: ${{ steps.coverage.outputs.branch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:coverage
        working-directory: apps/web
      - name: Frontend coverage summary
        id: coverage
        if: always()
        run: python3 scripts/ci/coverage.py frontend
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage/
          retention-days: 7
      - run: npm run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7
  integration:
    name: PostgreSQL and API acceptance
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: backend-jars
          path: services/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: apps/web/dist/
      - run: bash scripts/setup-local.sh
      - name: Validate deployment bundle
        run: |
          bash -n scripts/cd/package.sh scripts/cd/deploy.sh
          bash scripts/cd/package.sh "$RUNNER_TEMP/release.tar.gz"
      - run: docker compose --env-file .env -f deployment/compose.yaml config --quiet
      - run: docker compose --env-file .env -f deployment/compose.yaml up --build -d --scale admission=2
      - run: bash scripts/smoke.sh
      - name: Database and business acceptance
        run: |
          bash scripts/check-db-isolation.sh
          set -a
          source .env
          set +a
          python3 scripts/business-fixes-acceptance.py
          python3 scripts/gateway-scaling-acceptance.py
          python3 scripts/organization-acceptance.py
          python3 scripts/organization-security-acceptance.py
          python3 scripts/visibility-acceptance.py
          python3 scripts/notifications-acceptance.py
          python3 scripts/membership-notifications-acceptance.py
          python3 scripts/organization-governance-acceptance.py
          python3 scripts/event-cancellation-acceptance.py
          python3 scripts/predeployment-fixes-acceptance.py
          python3 scripts/organization-migration-acceptance.py
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p ci-logs
          if [ -f .env ]; then
            docker compose --env-file .env -f deployment/compose.yaml ps -a > ci-logs/containers.txt
            docker compose --env-file .env -f deployment/compose.yaml logs --no-color > ci-logs/compose.log 2>&1
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: integration-diagnostics
          path: ci-logs/
          retention-days: 7
      - name: Stop containers
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deployment/compose.yaml down
          fi

  deploy:
    name: Deploy Lightsail staging
    needs: [backend, frontend, integration]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: lightsail-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://swe5001.seventh720.com
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Skip superseded main builds
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "This commit was superseded on main; skipping deployment."
          fi
      - uses: actions/download-artifact@v8.0.2
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: backend-jars
          path: services/
      - uses: actions/download-artifact@v8.0.2
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: web-dist
          path: apps/web/dist/
      - name: Deploy tested artifacts
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.STAGING_HOST }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          key="$RUNNER_TEMP/staging-key"
          hosts="$RUNNER_TEMP/staging-known-hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          bash scripts/cd/package.sh "$RUNNER_TEMP/release.tar.gz"
          ssh_options=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" "ubuntu@$DEPLOY_HOST" \
            "mkdir -p /home/ubuntu/swe5001/releases/$GITHUB_SHA && tar -xzf - -C /home/ubuntu/swe5001/releases/$GITHUB_SHA" < "$RUNNER_TEMP/release.tar.gz"
          ssh "${ssh_options[@]}" "ubuntu@$DEPLOY_HOST" \
            "cd /home/ubuntu/swe5001/releases/$GITHUB_SHA && bash scripts/cd/deploy.sh $GITHUB_SHA"
          for path in / /health/identity /health/event-catalog /health/admission; do
            curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 15 \
              "https://swe5001.seventh720.com$path" > /dev/null
          done
          echo "Deployed commit $GITHUB_SHA to https://swe5001.seventh720.com" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Telegram notification
    needs: [backend, frontend, integration]
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Send build result
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BACKEND_LINES: ${{ needs.backend.outputs.line }}
          BACKEND_BRANCHES: ${{ needs.backend.outputs.branch }}
          FRONTEND_LINES: ${{ needs.frontend.outputs.line }}
          FRONTEND_BRANCHES: ${{ needs.frontend.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json, os, urllib.request
          token = os.environ.get('TELEGRAM_TOKEN')
          chat = os.environ.get('TELEGRAM_TO')
          if not token or not chat:
              print('::notice::Telegram secrets are absent; notification skipped.')
              raise SystemExit(0)
          text = '\n'.join([
              'SEMS Platform CI',
              'Backend: ' + os.environ['BACKEND_RESULT'],
              'Backend unit coverage (line / branch): ' + os.environ['BACKEND_LINES'] + ' / ' + os.environ['BACKEND_BRANCHES'],
              'Frontend: ' + os.environ['FRONTEND_RESULT'],
              'Frontend coverage (line / branch): ' + os.environ['FRONTEND_LINES'] + ' / ' + os.environ['FRONTEND_BRANCHES'],
              'PostgreSQL/API integration: ' + os.environ['INTEGRATION_RESULT'],
              os.environ['GITHUB_REPOSITORY'],
              'Ref: ' + os.environ['GITHUB_REF_NAME'],
              'Commit: ' + os.environ['GITHUB_SHA'][:12],
              os.environ['RUN_URL'],
          ])
          request = urllib.request.Request(
              'https://api.telegram.org/bot' + token + '/sendMessage',
              data=json.dumps({'chat_id': chat, 'text': text}).encode(),
              headers={'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get('ok'):
                  raise RuntimeError('Rejected')
          except Exception:
              print('::warning::Telegram delivery failed; check bot access and repository secrets.')
              raise SystemExit(1)
          print('Telegram notification delivered.')
