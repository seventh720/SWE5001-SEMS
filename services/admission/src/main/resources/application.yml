spring:
  application:
    name: admission-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: admission
    schemas: admission
    create-schemas: false
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
sems:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
    issuer: sems-identity
  internal:
    inbound-token: ${CATALOG_TO_ADMISSION_TOKEN}
    outbound-token: ${ADMISSION_TO_CATALOG_TOKEN}
    remote-url: http://event-catalog:8082
