name: sems-platform
services:
  identity:
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
  event-catalog:
    build:
      context: ..
      dockerfile: services/event-catalog/Dockerfile
  admission:
    build:
      context: ..
      dockerfile: services/admission/Dockerfile
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity
      - event-catalog
      - admission
