# Applied separately from application CD; business namespace and production marker.
apiVersion: v1
kind: Namespace
metadata:
  name: sems-prod
  annotations:
    sems.seventh720.com/environment: production
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sems-public
  namespace: sems-prod
  labels:
    app.kubernetes.io/part-of: sems
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - swe5001.seventh720.com
  rules:
    - host: swe5001.seventh720.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
