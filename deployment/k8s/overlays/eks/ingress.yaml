apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sems
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: CONFIGURE_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/healthcheck-path: /health/gateway
spec:
  ingressClassName: alb
  rules:
    - host: sems-test.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
