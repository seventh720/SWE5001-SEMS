apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-catalog
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: event-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-catalog
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: event-catalog
      containers:
        - name: event-catalog
          image: sems-platform-event-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: sems-runtime
            - secretRef:
                name: event-catalog-secrets
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: sems-database
                  key: CATALOG_DB_URL
            - name: DB_USERNAME
              value: catalog_app
            - name: CATALOG_DB_POOL_SIZE
              value: "10"
            - name: JWT_PUBLIC_KEY
              value: /run/keys/jwt-public.pem
          volumeMounts:
            - name: jwt-public
              mountPath: /run/keys
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: jwt-public
          secret:
            secretName: jwt-public
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: event-catalog
spec:
  selector:
    app.kubernetes.io/name: event-catalog
  ports:
    - name: http
      port: 8082
      targetPort: http
---
# Nginx needs individual ready Pod addresses to retry a safe Catalog read on
# another replica. A regular ClusterIP remains available to Java clients above.
apiVersion: v1
kind: Service
metadata:
  name: event-catalog-pods
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: event-catalog
  ports:
    - name: http
      port: 8082
      targetPort: http
