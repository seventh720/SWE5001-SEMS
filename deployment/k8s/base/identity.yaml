apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: identity
      containers:
        - name: identity
          image: sems-platform-identity:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: sems-runtime
            - secretRef:
                name: identity-secrets
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: sems-database
                  key: IDENTITY_DB_URL
            - name: DB_USERNAME
              value: identity_app
            - name: JWT_PUBLIC_KEY
              value: /run/keys/jwt-public.pem
            - name: JWT_PRIVATE_KEY
              value: /run/private-keys/jwt-private.pem
          volumeMounts:
            - name: jwt-public
              mountPath: /run/keys
              readOnly: true
            - name: jwt-private
              mountPath: /run/private-keys
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: jwt-public
          secret:
            secretName: jwt-public
            defaultMode: 0440
        - name: jwt-private
          secret:
            secretName: jwt-private
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: identity
spec:
  selector:
    app.kubernetes.io/name: identity
  ports:
    - name: http
      port: 8081
      targetPort: http
