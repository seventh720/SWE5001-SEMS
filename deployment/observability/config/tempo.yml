target: all
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 20000
      burst_size_bytes: 40000
      max_traces_per_user: 1000
    compaction:
      block_retention: 24h
usage_report:
  reporting_enabled: false
