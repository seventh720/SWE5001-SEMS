global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: sems-k3s
    environment: production
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: telemetry
    honor_labels: true
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: kube-state-metrics
    static_configs:
      - targets: [kube-state-metrics:8080]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: node
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [observability]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
  - job_name: kubernetes-apiserver
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    static_configs:
      - targets: [kubernetes.default.svc:443]
  - job_name: cadvisor
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: sems-prod|observability|kube-system
        action: keep
      - source_labels: [container]
        regex: "|POD"
        action: drop
  - job_name: public-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://swe5001.seventh720.com/health/gateway
          - https://swe5001.seventh720.com/health/identity
          - https://swe5001.seventh720.com/health/event-catalog
          - https://swe5001.seventh720.com/health/admission
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: observability
    static_configs:
      - targets: [alertmanager:9093, loki:3100, tempo:3200, blackbox:9115]
