apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: sems-observability
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sems-observability-local
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: sems-observability-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: sems-observability-local
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: sems-observability-local
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: sems-observability-local
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: sems-observability-local
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sems-observability-prometheus
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/metrics
  - nodes/proxy
  - pods
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sems-observability-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sems-observability-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sems-observability-kube-state-metrics
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - pods
  - persistentvolumeclaims
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sems-observability-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sems-observability-kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/data
        - --storage.tsdb.retention.time=48h
        - --storage.tsdb.retention.size=512MB
        - --query.max-concurrency=4
        - --query.max-samples=1000000
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 50m
            memory: 160Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 12
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus
      nodeSelector:
        kubernetes.io/hostname: sems-k3s-server
      serviceAccountName: prometheus
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
        args: []
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 25m
            memory: 160Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: username
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_SERVER_DOMAIN
          value: grafana.seventh720.com
        - name: GF_SERVER_ROOT_URL
          value: https://grafana.seventh720.com/
        - name: GF_SECURITY_COOKIE_SECURE
          value: 'true'
        - name: GF_SECURITY_COOKIE_SAMESITE
          value: lax
        - name: GF_METRICS_BASIC_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: username
        - name: GF_METRICS_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_LOG_LEVEL
          value: warn
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: /var/lib/grafana/dashboards/sems.json
        - name: GF_PATHS_BUNDLED_PLUGINS
          value: /var/lib/grafana/plugins-bundled
        - name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE
          value: 'false'
        - name: GOMEMLIMIT
          value: 192MiB
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 12
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: data
        persistentVolumeClaim:
          claimName: grafana
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
      nodeSelector:
        kubernetes.io/hostname: sems-k3s-server
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
