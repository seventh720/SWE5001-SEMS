worker_processes auto;
worker_rlimit_nofile 8192;
events {
    # Both client and upstream sockets count toward this limit.
    worker_connections 4096;
}
http {
    proxy_http_version 1.1;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    # Shared authentication budget also works behind the HTTPS proxy without trusting client headers.
    limit_req_zone $server_addr zone=authentication:1m rate=5r/s;
    limit_req_status 429;
    log_format request_metrics escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"upstream":"$upstream_addr","upstream_duration":"$upstream_response_time","request_id":"$request_id"}';

    # Omit successful readiness polling; retain failures and business requests.
    map "$uri:$status" $loggable {
        default 1;
        ~^/health/(identity|event-catalog|admission):2[0-9][0-9]$ 0;
    }
    access_log /var/log/nginx/access.log request_metrics if=$loggable;
    upstream identity_pool { zone identity_pool 64k; server identity:8081 resolve max_fails=1 fail_timeout=5s; keepalive 32; }
    upstream event_catalog_pool { zone event_catalog_pool 64k; server event-catalog:8082 resolve max_fails=1 fail_timeout=5s; keepalive 32; }
    upstream admission_pool { zone admission_pool 64k; server admission:8083 resolve max_fails=1 fail_timeout=5s; keepalive 32; }
    upstream web_pool { zone web_pool 64k; server web:80 resolve max_fails=1 fail_timeout=5s; keepalive 32; }
    # Internal service endpoint; never expose 8080 through the public entry point.
    # Admission's Catalog reads use the same dynamically resolved replica pool.
    server {
        listen 8080;
        proxy_connect_timeout 500ms;
        proxy_read_timeout 2s;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 2500ms;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # This POST only reads event snapshots; it is safe to resend.
        location = /internal/v1/events/details {
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_pass http://event_catalog_pool;
        }
        location /internal/v1/events/ {
            # GETs can fail over; Nginx does not resend an already-sent POST.
            # In particular, prepare-sales remains protected from blind replay.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_pass http://event_catalog_pool;
        }
        location / { return 404; }
    }
    server {
        listen 80;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        location = /health/gateway { default_type text/plain; return 200 'ok\n'; }
        location = /api/v1/auth/login { limit_req zone=authentication burst=10 nodelay; proxy_pass http://identity_pool; }
        location = /api/v1/auth/register { limit_req zone=authentication burst=10 nodelay; proxy_pass http://identity_pool; }
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/problem+json;
            add_header Retry-After 5 always;
            return 429 '{"title":"Too many authentication attempts","status":429,"detail":"Please wait a few seconds before signing in or registering again."}';
        }
        location = /health/identity { proxy_pass http://identity_pool/actuator/health/readiness; }
        location = /health/event-catalog { proxy_pass http://event_catalog_pool/actuator/health/readiness; }
        location = /health/admission { proxy_pass http://admission_pool/actuator/health/readiness; }
        location /api/v1/admin/organizations { proxy_pass http://identity_pool; }
        location /api/v1/organizations/ { proxy_pass http://identity_pool; }
        location /api/v1/invitations/ { proxy_pass http://identity_pool; }
        location /api/v1/me/invitations { proxy_pass http://identity_pool; }
        location /api/v1/me/membership-notifications { proxy_pass http://identity_pool; }
        location /api/v1/me/notifications { proxy_pass http://admission_pool; }
        location = /api/v1/me/organizations { proxy_pass http://identity_pool; }
        location = /api/v1/me/staff-assignments { proxy_pass http://admission_pool; }
        location ~ ^/api/v1/events/[^/]+/check-ins$ { proxy_pass http://admission_pool; }
        location ~ ^/api/v1/organizer/events/[^/]+/(staff|summary)$ { proxy_pass http://admission_pool; }
        location = /api/v1/profile { proxy_pass http://identity_pool; }
        location /api/v1/profile/ { proxy_pass http://identity_pool; }
        location /api/v1/pre-registrations { proxy_pass http://admission_pool; }
        location /api/v1/auth/ { proxy_pass http://identity_pool; }
        location /api/v1/admin/ { proxy_pass http://identity_pool; }
        location ~ ^/api/v1/(organizer/)?events/[^/]+/ticket-types$ { proxy_pass http://admission_pool; }
        location ~ ^/api/v1/organizer/events/[^/]+/bookings$ { proxy_pass http://admission_pool; }
        location = /api/v1/events { proxy_pass http://event_catalog_pool; }
        location /api/v1/events/ { proxy_pass http://event_catalog_pool; }
        location /api/v1/organizer/organizations/ { proxy_pass http://event_catalog_pool; }
        location = /api/v1/organizer/events { proxy_pass http://event_catalog_pool; }
        location /api/v1/organizer/events/ { proxy_pass http://event_catalog_pool; }
        location = /api/v1/bookings { proxy_pass http://admission_pool; }
        location /api/v1/bookings/ { proxy_pass http://admission_pool; }
        location /api/ { return 404; }
        location /internal/ { return 404; }
        location / { proxy_pass http://web_pool; }
    }
}
