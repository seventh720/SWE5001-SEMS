events {}
http {
    server {
        listen 80;
        location = /health/identity { proxy_pass http://identity:8081/actuator/health/readiness; }
        location = /health/event-catalog { proxy_pass http://event-catalog:8082/actuator/health/readiness; }
        location = /health/admission { proxy_pass http://admission:8083/actuator/health/readiness; }
        location = /api/v1/profile { proxy_pass http://identity:8081; }
        location /api/v1/pre-registrations { proxy_pass http://admission:8083; }
        location /api/v1/auth/ { proxy_pass http://identity:8081; }
        location /api/v1/admin/ { proxy_pass http://identity:8081; }
        location ~ ^/api/v1/(organizer/)?events/[^/]+/ticket-types$ { proxy_pass http://admission:8083; }
        location ~ ^/api/v1/organizer/events/[^/]+/bookings$ { proxy_pass http://admission:8083; }
        location = /api/v1/events { proxy_pass http://event-catalog:8082; }
        location /api/v1/events/ { proxy_pass http://event-catalog:8082; }
        location = /api/v1/organizer/events { proxy_pass http://event-catalog:8082; }
        location /api/v1/organizer/events/ { proxy_pass http://event-catalog:8082; }
        location = /api/v1/bookings { proxy_pass http://admission:8083; }
        location /api/v1/bookings/ { proxy_pass http://admission:8083; }
        location /api/ { return 404; }
        location /internal/ { return 404; }
        location / { proxy_pass http://web:80; }
    }
}
